[workspace]
resolver = "3"
members = ["core_lib", "app/main/src-tauri"]

[workspace.package]
version = "0.12.0"
edition = "2024"
authors = ["martichou", "mtch3n"]
license = "GPL-3.0-only"
repository = "https://github.com/mtch3n/quickshare"

[workspace.dependencies]
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "io-util", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
