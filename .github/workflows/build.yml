name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # WebKitGTK/GTK packages the AppImage is linked against. Built on the oldest
  # supported Ubuntu so the AppImage runs on as many distributions as possible.
  LINUX_DEPS: >-
    build-essential file protobuf-compiler libfuse2
    libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/main/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/main/pnpm-lock.yaml

      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: TypeScript bindings are up to date
        run: git diff --exit-code core_lib/bindings

      - name: Frontend install
        working-directory: app/main
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        working-directory: app/main
        run: pnpm lint && pnpm exec prettier --check "src/**/*.{ts,tsx}"
      - name: Frontend build
        working-directory: app/main
        run: pnpm build

  appimage:
    needs: check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/main/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/main/pnpm-lock.yaml

      - name: Build AppImage
        working-directory: app/main
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles appimage

      - name: Repack AppImage without bundled Wayland libraries
        id: appimage
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${{ github.ref_type }}" = tag ]; then label="$version"; else label="$version-$(git rev-parse --short HEAD)"; fi
          out="RQuickShare-$label-x86_64.AppImage"
          app/main/src-tauri/linux/repack-appimage.sh target/release/bundle/appimage/rquickshare.AppDir "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.appimage.outputs.path }}
          path: ${{ steps.appimage.outputs.path }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.appimage.outputs.path }}" \
            --title "${{ github.ref_name }}" --generate-notes

      - name: Publish nightly
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f nightly && git push -f origin nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release view nightly --json assets --jq '.assets[].name' \
              | xargs -r -I{} gh release delete-asset nightly {} --yes
          else
            gh release create nightly --prerelease --title "Nightly" \
              --notes "Built automatically from the latest commit on master."
          fi
          gh release upload nightly "${{ steps.appimage.outputs.path }}"
